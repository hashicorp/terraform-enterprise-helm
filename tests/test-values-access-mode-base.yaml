# Base test values for TFE_ADMIN_CONSOLE_ACCESS_MODE validation
# The accessMode value will be set via --set flag in the validation script

image:
  repository: images.releases.hashicorp.com
  name: hashicorp/terraform-enterprise
  tag: v202501-1

tfe:
  adminConsole:
    accessMode: ""

env:
  variables:
    TFE_HOSTNAME: "test.example.com"
  secrets:
    TFE_ENCRYPTION_PASSWORD: "test-password"
    TFE_LICENSE: "test-license"
