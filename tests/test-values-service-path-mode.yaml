# Test values for service port exposure with accessMode=path
# Expected: Service should NOT expose admin-https-port (only standard HTTPS)

image:
  repository: images.releases.hashicorp.com
  name: hashicorp/terraform-enterprise
  tag: v202501-1

tfe:
  adminConsole:
    accessMode: "path"

service:
  type: ClusterIP

env:
  variables:
    TFE_HOSTNAME: "test.example.com"
  secrets:
    TFE_ENCRYPTION_PASSWORD: "test-password"
    TFE_LICENSE: "test-license"
