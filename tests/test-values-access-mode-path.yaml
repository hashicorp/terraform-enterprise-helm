# Test values for TFE_ADMIN_CONSOLE_ACCESS_MODE=path
# Expected: TFE_ADMIN_CONSOLE_ACCESS_MODE should be set to "path" in ConfigMap

image:
  repository: images.releases.hashicorp.com
  name: hashicorp/terraform-enterprise
  tag: v202501-1

tfe:
  adminConsole:
    accessMode: "path"

env:
  variables:
    TFE_HOSTNAME: "test.example.com"
  secrets:
    TFE_ENCRYPTION_PASSWORD: "test-password"
    TFE_LICENSE: "test-license"
