# Test values for TFE_ADMIN_CONSOLE_ACCESS_MODE=port
# Expected: TFE_ADMIN_CONSOLE_ACCESS_MODE should be set to "port" in ConfigMap

image:
  repository: images.releases.hashicorp.com
  name: hashicorp/terraform-enterprise
  tag: v202501-1

tfe:
  adminConsole:
    accessMode: "port"

env:
  variables:
    TFE_HOSTNAME: "test.example.com"
  secrets:
    TFE_ENCRYPTION_PASSWORD: "test-password"
    TFE_LICENSE: "test-license"
