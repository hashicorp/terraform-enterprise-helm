name: Changelog Policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changelog:
    name: Check changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Never check out or execute pull request code in this trusted workflow.
      # The pull request ref is fetched only so the policy can read files via git show.

      - name: Fetch pull request
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"

      - name: Validate changelog update
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          if jq -e 'index("no-user-facing-impact") != null' <<< "$PR_LABELS" > /dev/null; then
            if git diff --quiet "$merge_base" "$HEAD_SHA" -- CHANGELOG.md; then
              echo "The no-user-facing-impact label is present and CHANGELOG.md is unchanged."
              exit 0
            fi

            echo "Remove the no-user-facing-impact label when changing CHANGELOG.md." >&2
            exit 1
          fi

          if git diff --quiet "$merge_base" "$HEAD_SHA" -- CHANGELOG.md; then
            echo "Update CHANGELOG.md or apply the no-user-facing-impact label." >&2
            exit 1
          fi

          echo "CHANGELOG.md was updated."
